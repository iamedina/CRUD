<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar acceso | Gestor de contraseñas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="app.js" defer></script>
</head>

<body>
    <main class="app-shell">
        <section class="panel form-panel">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Nuevo registro</p>
                    <h1>Agregar acceso</h1>
                </div><i class="bi bi-key" aria-hidden="true"></i>
            </div>
            <form onsubmit="event.preventDefault(); registrar();">
                <div class="field"><label for="plataforma"><i class="bi bi-globe2"></i>Plataforma</label><input
                        type="text" class="form-control" id="plataforma" placeholder="Ej. Gmail, Netflix, GitHub"
                        required></div>
                <div class="field"><label for="usuario"><i class="bi bi-person"></i>Usuario</label><input type="text"
                        class="form-control" id="usuario" placeholder="Tu usuario o correo" required></div>
                <div class="field"><label for="clave"><i class="bi bi-lock"></i>Contraseña</label><input type="password"
                        class="form-control" id="clave" placeholder="Escribe la contraseña" required></div>
                <div class="form-actions"><a class="btn-secondary" href="index.html"><i
                            class="bi bi-arrow-left"></i>Cancelar</a><button class="btn btn-primary" type="submit"><i
                            class="bi bi-check-lg"></i>Guardar acceso</button></div>
            </form>
        </section>
    </main>
</body>

</html>
