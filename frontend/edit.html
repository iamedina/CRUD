<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="app.js"></script>
    <title>Editar acceso | Gestor de contraseñas</title>
</head>

<body>
    <main class="app-shell">
        <section class="panel form-panel">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Actualizar registro</p>
                    <h1>Editar acceso</h1>
                </div><i class="bi bi-pencil-square" aria-hidden="true"></i>
            </div>
            <form onsubmit="event.preventDefault(); modificar(variable1);">
                <div class="field"><label for="plataforma"><i class="bi bi-globe2"></i>Plataforma</label><input
                        type="text" class="form-control" id="plataforma" required></div>
                <div class="field"><label for="usuario"><i class="bi bi-person"></i>Usuario</label><input type="text"
                        class="form-control" id="usuario" required></div>
                <div class="field"><label for="clave"><i class="bi bi-lock"></i>Contraseña</label>
                    <div class="password-input-wrap">
                        <input type="password" class="form-control" id="clave" required>
                        <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <div class="form-actions"><a class="btn-secondary" href="index.html"><i
                            class="bi bi-arrow-left"></i>Cancelar</a><button class="btn btn-primary" type="submit"><i
                            class="bi bi-check-lg"></i>Guardar cambios</button></div>
            </form>
        </section>
    </main>

    <script>
        function getParameterByName(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || '';
        }
        var variable1 = getParameterByName('variable1');
        consulta_individual(variable1);
        setupPasswordToggle();
    </script>
</body>

</html>
